    <!-- Seamless Live Server Support: When launched via Live Server instead of Vite, load built bundle -->
    <script>
      (function() {
        var p = window.location.port;
        var isLiveServer = (p === '5500' || p === '5501' || p === '5502' || p === '8080' || p === '5555' || window.location.protocol === 'file:');
        if (isLiveServer && window.location.pathname.indexOf('/dist/') === -1) {
          window.location.replace('./dist/index.html');
        }
      })();
    </script>
